AWSTemplateFormatVersion: '2010-09-09'
Description: 'Infraestructura Serverless: Configuración de Amazon Cognito para SaaS Legal Multi-tenant'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Entorno de despliegue de la plataforma legal.

Resources:
  # 1. POOL DE USUARIOS CENTRALIZADO
  LegalUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'veritas-control-user-pool-${Environment}'
      
      # Configuración de inicio de sesión: Se usará el Correo Electrónico
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      
      # Políticas de contraseñas robustas para cumplimiento corporativo
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7

      # ATRIBUTOS PERSONALIZADOS PARA CONTROL MULTI-TENANT & ROLES
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
        # Identificador único del Bufete (UUID)
        - Name: tenant_id
          AttributeDataType: String
          Required: false
          Mutable: false # Fijo una vez creado para evitar su alteración por código
        # Rol Jurídico (Socio, Asociado, Pasante, Contador)
        - Name: role
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: bufete_name
          AttributeDataType: String
          Required: false
          Mutable: true # Permitimos que sea mutable por si la firma cambia de razón social
        - Name: bufete_rfc
          AttributeDataType: String
          Required: false
          Mutable: true
          StringAttributeConstraints:
            MinLength: "12"
            MaxLength: "13"

  # 2. CLIENTE DE APLICACIÓN (Conexión directa para el Frontend en React)
  LegalUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'veritas-control-react-client-${Environment}'
      UserPoolId: !Ref LegalUserPool
      GenerateSecret: false # Debe ser falso para aplicaciones SPA / React
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH # Protocolo SRP seguro usado nativamente por Amplify Auth

# =========================================================================
# 3. PARÁMETROS EN AWS SYSTEMS MANAGER (PARAMETER STORE)
# =========================================================================
  
  ParamUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      # Estructura de nombres jerárquica y limpia standard en la industria
      Name: !Sub '/veritas-control/${Environment}/cognito/user-pool-id'
      Type: String
      Value: !Ref LegalUserPool
      Description: ID público del User Pool de Cognito para este entorno.

  ParamAppClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/veritas-control/${Environment}/cognito/app-client-id'
      Type: String
      Value: !Ref LegalUserPoolClient
      Description: ID público del Cliente de Aplicación de Cognito para React.

  ParamAwsRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/veritas-control/${Environment}/general/aws-region'
      Type: String
      Value: !Ref 'AWS::Region'
      Description: Región geográfica de AWS donde corre la plataforma.
