          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ["sts:AssumeRole"]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
  
  VeritasStepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'veritas-control-stepfunctions-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com] 
            Action: ["sts:AssumeRole"]
      Policies:
        - Statement:
            - Effect: Allow
              Action: ["lambda:InvokeFunction"]
              Resource:
                - !GetAtt MaterialidadExtractorPostgresLambda.Arn
                - !GetAtt MaterialidadRedactorBedrockLambda.Arn
                - !GetAtt MaterialidadEscultorReportLabLambda.Arn

  VeritasMaterialidadStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'veritas-control-materialidad-orquestador-${Environment}'
      Definition:
        Comment: "Orquestador asincrono pericial para generacion masiva de PDFs con IA"
        StartAt: ProcesamientoParaleloMaterialidad
        States:
          ProcesamientoParaleloMaterialidad:
            Type: Parallel
            Next: ConsolidarExpedienteFinal
            Branches:
              - StartAt: GenerarFaseContrato
                States:
                  GenerarFaseContrato:
                    Type: Task
                    Resource: !GetAtt MaterialidadContratoLambda.Arn
                    End: true
              - StartAt: GenerarFasePlaneacion
                States:
                  GenerarFasePlaneacion:
                    Type: Task
                    Resource: !GetAtt MaterialidadPlaneacionLambda.Arn
                    End: true
              - StartAt: GenerarFaseComunicacion
                States:
                  GenerarFaseComunicacion:
                    Type: Task
                    Resource: !GetAtt MaterialidadComunicacionLambda.Arn
                    End: true
              - StartAt: GenerarFaseEvidenciaFacturas
                States:
                  GenerarFaseEvidenciaFacturas:
                    Type: Task
                    Resource: !GetAtt MaterialidadEvidenciaLambda.Arn
                    End: true
          ConsolidarExpedienteFinal:
            Type: Task
            Resource: !GetAtt MaterialidadConsolidadorLambda.Arn
            End: true
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadContratoLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadPlaneacionLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadComunicacionLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadEvidenciaLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadConsolidadorLambda }

  VeritasProcesadorS3StateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'veritas-control-s3-procesador-${Environment}'
      Definition:
        Comment: "Orquestador de eventos contables disparado por S3"
        StartAt: ParsearDocumentoS3
        States:
          ParsearDocumentoS3:
            Type: Task
            Resource: !GetAtt ParserS3Lambda.Arn
            Next: InyeccionParalelaCQRS
          InyeccionParalelaCQRS:
            Type: Parallel
            End: true
            Branches:
              - StartAt: GuardarPostgresCrudo
                States:
                  GuardarPostgresCrudo:
                    Type: Task
                    Resource: !GetAtt CargaExcelLambda.Arn
                    TimeoutSeconds: 40
                    End: true
              - StartAt: CalcularKPIsNoSql
                States:
                  CalcularKPIsNoSql:
                    Type: Task
                    Resource: !GetAtt CalcularKpisNoSqlLambda.Arn
                    End: true
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref ParserS3Lambda }
        - LambdaInvokePolicy: { FunctionName: !Ref CargaExcelLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref CalcularKpisNoSqlLambda }
      Events:
        FacturaSubidaS3Event:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source: ["aws.s3"]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [ !Sub '{{resolve:ssm:/veritas-control/${Environment}/storage/facturas-bucket-name}}' ]

  MaterialidadOrquestadorLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'veritas-control-mat-orquestador-${Environment}'
      Runtime: python3.10
      Handler: orquestador_materialidad.handler
      CodeUri: ./lambdas/materialidad/
      Environment:
        Variables:
          DYNAMODB_TABLE: !Sub 'veritas-control-materialidad-status-${Environment}'
          BUCKET_NAME:
            Fn::ImportValue: !Sub 'veritas-control-storage-infra-${Environment}-MaterialidadBucketName'
          WORKER_LAMBDA_NAME: !Sub 'veritas-control-mat-worker-${Environment}'
      Policies:
        - Statement:
            - Effect: Allow
              Action: ["lambda:InvokeFunction"]
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:veritas-control-mat-worker-${Environment}'
            - Effect: Allow
              Action: ["dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:GetItem"]
              Resource:
                Fn::ImportValue: !Sub 'veritas-control-database-infra-${Environment}-MaterialidadTableArn'
        - AWSLambdaVPCAccessExecutionRole 

  VeritasMaterialidadQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'veritas-control-mat-queue-${Environment}'
      VisibilityTimeout: 300

  MaterialidadExtractorPostgresLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'veritas-control-mat-step1-extractor-${Environment}'
      Handler: step1_extractor_handler.handler
      CodeUri: ./lambdas/materialidad/
      VpcConfig:
        SecurityGroupIds:
          - !Sub '{{resolve:ssm:/veritas-control/${Environment}/network/lambdas-sg-id}}'
        SubnetIds:
          - !Sub '{{resolve:ssm:/veritas-control/${Environment}/network/subnet-privada-1}}'
          - !Sub '{{resolve:ssm:/veritas-control/${Environment}/network/subnet-privada-2}}'
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: ["dynamodb:GetItem", "dynamodb:UpdateItem"]
              Resource:
                Fn::ImportValue: !Sub 'veritas-control-database-infra-${Environment}-MaterialidadTableArn'
    Metadata:
      BuildMethod: python3.11

  MaterialidadRedactorBedrockLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'veritas-control-mat-step2-redactor-${Environment}'
      Handler: step2_redactor_handler.handler
      CodeUri: ./lambdas/materialidad/
      Policies:
        - Statement:
            - Effect: Allow
              Action: ["bedrock:InvokeModel"]
              Resource: ["arn:aws:bedrock:*:*:inference-profile/*", "arn:aws:bedrock:*:*:foundation-model/*"]
    Metadata:
      BuildMethod: python3.11

  MaterialidadEscultorReportLabLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'veritas-control-mat-step3-escultor-${Environment}'
      Handler: step3_escultor_handler.handler
      CodeUri: ./lambdas/materialidad/
      Environment:
        Variables:
          DYNAMODB_TABLE: !Sub 'veritas-control-materialidad-status-${Environment}'
      Policies:
        - S3CrudPolicy:
            BucketName:
              Fn::ImportValue: !Sub 'veritas-control-storage-infra-${Environment}-MaterialidadBucketName'
        - Statement:
            - Effect: Allow
              Action: ["dynamodb:UpdateItem"]
              Resource:
                Fn::ImportValue: !Sub 'veritas-control-database-infra-${Environment}-MaterialidadTableArn'
    Metadata:
      BuildMethod: python3.11

  VeritasMaterialidadStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'veritas-materialidad-pipeline-${Environment}'
      RoleArn: !GetAtt VeritasStepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Pipeline Forense de Materialidad - Veritas Control",
          "StartAt": "ExtraerDatos",
          "States": {
            "ExtraerDatos": {
              "Type": "Task",
              "Resource": "${MaterialidadExtractorPostgresLambda.Arn}",
              "Next": "GenerarTextoIA"
            },
            "GenerarTextoIA": {
              "Type": "Task",
              "Resource": "${MaterialidadRedactorBedrockLambda.Arn}",
              "Next": "EsculpirPDF"
            },
            "EsculpirPDF": {
              "Type": "Task",
              "Resource": "${MaterialidadEscultorReportLabLambda.Arn}",
              "End": true
            }
          }
        }

  MaterialidadS3ZipPackerLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'veritas-control-mat-core-zip-packer-${Environment}'
      Handler: core_zip_packer_handler.handler
      CodeUri: ./lambdas/materialidad/
      Timeout: 120
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName:
              Fn::ImportValue: !Sub 'veritas-control-storage-infra-${Environment}-MaterialidadBucketName'

  S3BucketTemporalSAT:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "veritas-sat-listas-negras-temporal-${AWS::AccountId}"
