AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31 # Activa SAM
Description: 'Backend Serverless de Veritas Control optimizado con AWS SAM'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
  CognitoUserPoolArn:
    Type: String

Globals:
  Function:
    Timeout: 90
    MemorySize: 512
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        DB_HOST_PARAM: !Sub '/veritas-control/${Environment}/rds/postgres-endpoint'
        DB_PORT: "5432"
        DB_USER: "veritas_admin"
        DB_NAME: "veritas_db"
        SECRET_ARN_PARAM_PATH: !Sub '/veritas-control/${Environment}/rds/postgres-secret-arn'

Resources:
  # API GATEWAY CENTRAL CON SWAGGER INTEGRADO
  VeritasApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: "Veritas Control - API de Gestión Jurídica"
          version: "1.0.0"

        components:
          securitySchemes:
            CognitoAuthorizer:
              type: "apiKey"
              name: "Authorization"
              in: "header"
              x-amazon-apigateway-authtype: "cognito_user_pools"
              x-amazon-apigateway-authorizer:
                type: "cognito_user_pools"
                providerARNs:
                  - !Ref CognitoUserPoolArn
        paths:
          /swagger-json:
            get:
              summary: "Descargar esquema OpenAPI de Veritas Control"
              responses:
                '200':
                  description: "Estructura JSON de Swagger exitosa."
              # Retorna un mock de la especificación técnica de forma directa
              x-amazon-apigateway-integration:
                type: "mock"
                requestTemplates:
                  application/json: "{\"statusCode\": 200}"
                responses:
                  default:
                    statusCode: "200"
                    responseTemplates:
                      application/json: "{\"info\": {\"title\": \"Veritas Control\", \"version\": \"1.0.0\"}, \"paths\": {}}"
          /registro:
            post:
              summary: "Alta Administrativa de Personal (Solo Socios)"
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-integration:
                type: "aws_proxy"
                httpMethod: "POST"
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegistroLambda.Arn}/invocations'
                passthroughBehavior: "when_no_match"
              responses:
                '201':
                  description: "Usuario registrado con éxito."

            options:
              summary: "Soporte de CORS Preflight"
              responses:
                '200':
                  description: "CORS Preflight exitoso"
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: "string"
                    Access-Control-Allow-Methods:
                      schema:
                        type: "string"
                    Access-Control-Allow-Headers:
                      schema:
                        type: "string"
              x-amazon-apigateway-integration:
                type: "mock"
                requestTemplates:
                  application/json: "{\"statusCode\": 200}"
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: ""
          /finanzas/cargar-excel:
            post:
              summary: "Subir archivo Excel del SAT y vaciar datos a Postgres"
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-integration:
                type: "aws_proxy"
                httpMethod: "POST"
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CargaExcelLambda.Arn}/invocations'
                passthroughBehavior: "when_no_match"
