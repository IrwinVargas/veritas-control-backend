        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  VeritasMaterialidadNoSqlTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub 'veritas-control-materialidad-status-${Environment}'
      PrimaryKey: { Name: tenant_rfc, Type: String }

# =========================================================================
# REPOSITORIO DE ALMACENAMIENTO FISCAL (Amazon S3)
# =========================================================================
  VeritasMaterialidadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'veritas-control-materialidad-expedientes-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  VeritasFacturasS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'veritas-control-facturas-sat-${Environment}-${AWS::AccountId}'
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['PUT', 'POST']
            AllowedOrigins: ['http://localhost:5173'] # Tu URL local permitida
            MaxAge: 3000

  S3BucketTemporalSAT:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "veritas-sat-listas-negras-temporal-${AWS::AccountId}"
# =========================================================================
# MÁQUINA DE ESTADOS (Disparada en automático por S3)
# =========================================================================
  VeritasMaterialidadStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'veritas-control-materialidad-orquestador-${Environment}'
      Definition:
        Comment: "Orquestador asincrono pericial para generacion masiva de PDFs con IA"
        StartAt: ProcesamientoParaleloMaterialidad
        States:
          ProcesamientoParaleloMaterialidad:
            Type: Parallel
            Next: ConsolidarExpedienteFinal
            Branches:
              # Rama 1: Contratos
              - StartAt: GenerarFaseContrato
                States:
                  GenerarFaseContrato:
                    Type: Task
                    Resource: !GetAtt MaterialidadContratoLambda.Arn
                    End: true
              # Rama 2: Planeación y Benchmarking
              - StartAt: GenerarFasePlaneacion
                States:
                  GenerarFasePlaneacion:
                    Type: Task
                    Resource: !GetAtt MaterialidadPlaneacionLambda.Arn
                    End: true
              # Rama 3: Comunicación Empresarial
              - StartAt: GenerarFaseComunicacion
                States:
                  GenerarFaseComunicacion:
                    Type: Task
                    Resource: !GetAtt MaterialidadComunicacionLambda.Arn
                    End: true
              # Rama 4: Evidencias Digitales y Facturas
              - StartAt: GenerarFaseEvidenciaFacturas
                States:
                  GenerarFaseEvidenciaFacturas:
                    Type: Task
                    Resource: !GetAtt MaterialidadEvidenciaLambda.Arn
                    End: true

          ConsolidarExpedienteFinal:
            Type: Task
            Resource: !GetAtt MaterialidadConsolidadorLambda.Arn
            End: true
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadContratoLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadPlaneacionLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadComunicacionLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadEvidenciaLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref MaterialidadConsolidadorLambda }

  VeritasProcesadorS3StateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'veritas-control-s3-procesador-${Environment}'
      Definition:
        Comment: "Orquestador de eventos contables disparado por S3"
        StartAt: ParsearDocumentoS3
        States:
          ParsearDocumentoS3:
            Type: Task
            Resource: !GetAtt ParserS3Lambda.Arn
            Next: InyeccionParalelaCQRS
          InyeccionParalelaCQRS:
            Type: Parallel
            End: true
            Branches:
              - StartAt: GuardarPostgresCrudo
                States:
                  GuardarPostgresCrudo:
                    Type: Task
                    Resource: !GetAtt CargaExcelLambda.Arn
                    TimeoutSeconds: 40
                    End: true
              - StartAt: CalcularKPIsNoSql
                States:
                  CalcularKPIsNoSql:
                    Type: Task
                    Resource: !GetAtt CalcularKpisNoSqlLambda.Arn
                    End: true
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref ParserS3Lambda }
        - LambdaInvokePolicy: { FunctionName: !Ref CargaExcelLambda }
        - LambdaInvokePolicy: { FunctionName: !Ref CalcularKpisNoSqlLambda }
      # 🚀 DISPARADOR AUTOMÁTICO DE EVENTOS (EventBridge Rule)
      Events:
        FacturaSubidaS3Event:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source: ["aws.s3"]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [ !Ref VeritasFacturasS3Bucket ]

# =========================================================================
# SECCIÓN DE DATABASE Y SEGURIDAD
# =========================================================================
  VeritasVCP:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Veritas-Control-VPC'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Veritas-Control-IGW'
  
  VeritasVPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VeritasVCP
      InternetGatewayId: !Ref InternetGateway

  VeritasSubnetPrivadaUno:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VeritasVCP
      CidrBlock: "10.0.1.0/24" 
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: "Veritas Control - Subred Privada Aislada 1A"

  VeritasSubnetPrivadaDos:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VeritasVCP
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: "Veritas Control - Subred Privada Aislada 1B"

  VeritasTablaRuteoPrivada:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VeritasVCP
      Tags: [{ Key: Name, Value: "Veritas Control - Tabla de Ruteo Privada" }]

  VeritasPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VeritasVPCGatewayAttachment
    Properties:
      RouteTableId: !Ref VeritasTablaRuteoPrivada
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  VeritasAsociacionRuteoPrivadaUno:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VeritasSubnetPrivadaUno
      RouteTableId: !Ref VeritasTablaRuteoPrivada

  VeritasAsociacionRuteoPrivadaDos:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VeritasSubnetPrivadaDos
      RouteTableId: !Ref VeritasTablaRuteoPrivada

  VeritasDbSubnetGroupV2:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "Grupo de subredes integrado para el cluster de Aurora Serverless"
      SubnetIds:
        - !Ref VeritasSubnetPrivadaUno
        - !Ref VeritasSubnetPrivadaDos
  

  VeritasDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Permitir acceso a Postgres unicamente desde las Lambdas del SaaS"
      VpcId: !Ref VeritasVCP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt VeritasLambdasSecurityGroup.Id
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: "0.0.0.0/0"

  # INSTANCIA DE LECTURA/ESCRITURA DENTRO DEL CLUSTER
  VeritasPostgresDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub 'veritas-control-db-${Environment}'
      AllocatedStorage: '20' # 20 GB (Máximo permitido gratis en Free Tier)
      DBInstanceClass: db.t3.micro # Tipo de instancia 100% gratuita por 12 meses
      Engine: postgres
      EngineVersion: '15'
      DBName: veritas_db
      MasterUsername: veritas_admin
      MasterUserPassword: '{{resolve:secretsmanager:veritas-control/dev/database:SecretString:password}}'
      DBSubnetGroupName: !Ref VeritasDbSubnetGroupV2
      VPCSecurityGroups:
        - !GetAtt VeritasDbSecurityGroup.Id
      PubliclyAccessible: true
      DeleteAutomatedBackups: true
      DeletionProtection: false