  VeritasMaterialidadStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name:
        Fn::Sub: veritas-control-materialidad-orquestador-${Environment}
      Definition:
        Comment: Orquestador asincrono pericial para generacion masiva de PDFs con
          IA
        StartAt: ProcesamientoParaleloMaterialidad
        States:
          ProcesamientoParaleloMaterialidad:
            Type: Parallel
            Next: ConsolidarExpedienteFinal
            Branches:
            - StartAt: GenerarFaseContrato
              States:
                GenerarFaseContrato:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - MaterialidadContratoLambda
                    - Arn
                  End: true
            - StartAt: GenerarFasePlaneacion
              States:
                GenerarFasePlaneacion:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - MaterialidadPlaneacionLambda
                    - Arn
                  End: true
            - StartAt: GenerarFaseComunicacion
              States:
                GenerarFaseComunicacion:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - MaterialidadComunicacionLambda
                    - Arn
                  End: true
            - StartAt: GenerarFaseEvidenciaFacturas
              States:
                GenerarFaseEvidenciaFacturas:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - MaterialidadEvidenciaLambda
                    - Arn
                  End: true
          ConsolidarExpedienteFinal:
            Type: Task
            Resource:
              Fn::GetAtt:
              - MaterialidadConsolidadorLambda
              - Arn
            End: true
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: MaterialidadContratoLambda
      - LambdaInvokePolicy:
          FunctionName:
            Ref: MaterialidadPlaneacionLambda
      - LambdaInvokePolicy:
          FunctionName:
            Ref: MaterialidadComunicacionLambda
      - LambdaInvokePolicy:
          FunctionName:
            Ref: MaterialidadEvidenciaLambda
      - LambdaInvokePolicy:
          FunctionName:
            Ref: MaterialidadConsolidadorLambda
  VeritasProcesadorS3StateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name:
        Fn::Sub: veritas-control-s3-procesador-${Environment}
      Definition:
        Comment: Orquestador de eventos contables disparado por S3
        StartAt: ParsearDocumentoS3
        States:
          ParsearDocumentoS3:
            Type: Task
            Resource:
              Fn::GetAtt:
              - ParserS3Lambda
              - Arn
            Next: InyeccionParalelaCQRS
          InyeccionParalelaCQRS:
            Type: Parallel
            End: true
            Branches:
            - StartAt: GuardarPostgresCrudo
              States:
                GuardarPostgresCrudo:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - CargaExcelLambda
                    - Arn
                  TimeoutSeconds: 40
                  End: true
            - StartAt: CalcularKPIsNoSql
              States:
                CalcularKPIsNoSql:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - CalcularKpisNoSqlLambda
                    - Arn
                  End: true
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ParserS3Lambda
      - LambdaInvokePolicy:
          FunctionName:
            Ref: CargaExcelLambda
      - LambdaInvokePolicy:
          FunctionName:
            Ref: CalcularKpisNoSqlLambda
      Events:
        FacturaSubidaS3Event:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source:
              - aws.s3
              detail-type:
              - Object Created
              detail:
                bucket:
                  name:
                  - Ref: VeritasFacturasS3Bucket
