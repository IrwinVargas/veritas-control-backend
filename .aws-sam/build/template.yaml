        Ref: VeritasSubnetPrivadaUno
      RouteTableId:
        Ref: VeritasTablaRuteoPrivada
  VeritasAsociacionRuteoPrivadaDos:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: VeritasSubnetPrivadaDos
      RouteTableId:
        Ref: VeritasTablaRuteoPrivada
  VeritasDbSubnetGroupV2:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Grupo de subredes integrado para el cluster de Aurora
        Serverless
      SubnetIds:
      - Ref: VeritasSubnetPrivadaUno
      - Ref: VeritasSubnetPrivadaDos
  VeritasDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir acceso a Postgres unicamente desde las Lambdas del
        SaaS
      VpcId:
        Ref: VeritasVCP
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId:
          Fn::GetAtt:
          - VeritasLambdasSecurityGroup
          - Id
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        CidrIp: '0.0.0.0/0'
  VeritasPostgresDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier:
        Fn::Sub: veritas-control-db-${Environment}
      AllocatedStorage: '20'
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '15'
      DBName: veritas_db
      MasterUsername: veritas_admin
      MasterUserPassword: '{{resolve:secretsmanager:veritas-control/dev/database:SecretString:password}}'
      DBSubnetGroupName:
        Ref: VeritasDbSubnetGroupV2
      VPCSecurityGroups:
      - Fn::GetAtt:
        - VeritasDbSecurityGroup
        - Id
      PubliclyAccessible: true
      DeleteAutomatedBackups: true
      DeletionProtection: false
