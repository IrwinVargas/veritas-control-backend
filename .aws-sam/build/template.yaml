  CargaExcelLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: veritas-control-carga-excel-${Environment}
      Runtime: python3.10
      Architectures:
      - x86_64
      Handler: carga_excel_handler.handler
      CodeUri: CargaExcelLambda
      Timeout: 90
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - VeritasLambdaExecutionRole
        - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::GetAtt:
          - VeritasLambdasSecurityGroup
          - Id
        SubnetIds:
        - Ref: VeritasSubnetPrivadaUno
        - Ref: VeritasSubnetPrivadaDos
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - VeritasPostgresDB
            - Endpoint.Address
          DB_NAME: veritas_db
          DB_USER: veritas_admin
          DB_PORT: '5432'
          DB_PASSWORD: '{{resolve:secretsmanager:veritas-control/dev/database:SecretString:password}}'
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:veritas-control/dev/database*
    Metadata:
      BuildMethod: python3.10
      SamResourceId: CargaExcelLambda
  ListaClientesLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: veritas-control-lista-clientes-${Environment}
      Runtime: python3.10
      Handler: lista_clientes_handler.handler
      CodeUri: ListaClientesLambda
      Timeout: 15
      MemorySize: 128
      Architectures:
      - x86_64
      Role:
        Fn::GetAtt:
        - VeritasLambdaExecutionRole
        - Arn
      VpcConfig:
        SecurityGroupIds:
        - Fn::GetAtt:
          - VeritasLambdasSecurityGroup
          - Id
        SubnetIds:
        - Ref: VeritasSubnetPrivadaUno
        - Ref: VeritasSubnetPrivadaDos
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - VeritasPostgresDB
            - Endpoint.Address
          DB_NAME: veritas_db
          DB_USER: veritas_admin
          DB_PORT: '5432'
          DB_PASSWORD: '{{resolve:secretsmanager:veritas-control/dev/database:SecretString:password}}'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /finanzas/clientes
            Method: get
            RestApiId:
              Ref: VeritasApi
    Metadata:
      BuildMethod: python3.10
      SamResourceId: ListaClientesLambda
  MetricasLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.10
      SamResourceId: MetricasLambda
    Properties:
      FunctionName:
        Fn::Sub: veritas-control-dashboard-metricas-${Environment}
      Runtime: python3.10
      Handler: metricas_handler.handler
      CodeUri: MetricasLambda
      Timeout: 15
      MemorySize: 256
      Architectures:
      - x86_64
      Environment:
        Variables:
          DYNAMODB_TABLE:
            Ref: VeritasFinanzasNoSqlTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: VeritasFinanzasNoSqlTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /finanzas/dashboard-metricas
            Method: get
            RestApiId:
              Ref: VeritasApi
  RegistroLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: veritas-control-registro-handler-${Environment}
      Runtime: python3.10
      Handler: registro_handler.handler
      CodeUri: RegistroLambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USER_POOL_ID:
            Fn::Sub: '{{resolve:ssm:/veritas-control/${Environment}/cognito/user-pool-id}}'
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminCreateUser
          Resource:
            Ref: CognitoUserPoolArn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /registro
            Method: post
            RestApiId:
              Ref: VeritasApi
    Metadata:
      SamResourceId: RegistroLambda
  CalcularKpisNoSqlLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.10
      SamResourceId: CalcularKpisNoSqlLambda
    Properties:
      FunctionName:
